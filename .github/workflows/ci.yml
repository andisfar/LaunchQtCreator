name: CI

on:
  push:
    branches: [ main, develop, 'refactor/*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Run tests (VS Code 1.65.0)
        env:
          VSCODE_VERSION: '1.65.0'
        run: npm test
